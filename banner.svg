<svg width="1000" height="220" viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220">
        <animate attributeName="stop-color" values="#0b1220;#101a30;#0b1220" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#1a2f55">
        <animate attributeName="stop-color" values="#1a2f55;#25407a;#1a2f55" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#4f7bff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4f7bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="220" fill="url(#bg)"/>
  <rect width="1000" height="220" fill="url(#grid)"/>
  <rect width="1000" height="220" fill="url(#glow)"/>

  <circle cx="900" cy="40" r="3" fill="#7fb0ff">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="940" cy="90" r="2" fill="#7fb0ff">
    <animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="860" cy="130" r="2.5" fill="#7fb0ff">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="5s" repeatCount="indefinite"/>
  </circle>

  <text x="60" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">
    Rayân MOUAHID
  </text>
  <text x="60" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#9db4e0">
    Software Engineering Student · RAG · Vector Search · AI Agent Systems
  </text>

  <rect x="60" y="165" width="3" height="24" fill="#4f7bff"/>
  <text x="76" y="183" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#7fa0d8">
    Paris, France — Open to AI/ML Engineering internships abroad
  </text>
</svg>
