<svg width="1000" height="240" viewBox="0 0 1000 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220">
        <animate attributeName="stop-color" values="#0b1220;#101a30;#0b1220" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#1a2f55">
        <animate attributeName="stop-color" values="#1a2f55;#2c4a8f;#1a2f55" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow" cx="88%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#4f7bff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4f7bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="typeClip">
      <rect x="0" y="0" width="0" height="34">
        <animate attributeName="width" from="0" to="660" dur="2.8s" begin="0.4s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1000" height="240" fill="url(#bg)"/>
  <rect width="1000" height="240" fill="url(#grid)"/>
  <rect width="1000" height="240" fill="url(#glow)"/>

  <circle cx="900" cy="45" r="3" fill="#7fb0ff">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="945" cy="95" r="2" fill="#7fb0ff">
    <animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="860" cy="140" r="2.5" fill="#7fb0ff">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="35" r="2" fill="#7fb0ff" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <g>
    <circle cx="500" cy="120" r="0" fill="none" stroke="#4f7bff" stroke-width="1" opacity="0.25">
      <animate attributeName="r" from="0" to="500" dur="4s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.35" to="0" dur="4s" begin="0s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="60" y="105" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff">
    Rayân MOUAHID
  </text>

  <g clip-path="url(#typeClip)">
    <text x="60" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#9db4e0">
      Building RAG, Vector Search &amp; AI Agent Systems
    </text>
  </g>
  <rect x="60" y="127" width="2.5" height="22" fill="#7fb0ff">
    <animate attributeName="x" from="60" to="720" dur="2.8s" begin="0.4s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" begin="3.2s" repeatCount="indefinite"/>
  </rect>

  <rect x="60" y="178" width="3" height="26" fill="#4f7bff"/>
  <text x="76" y="197" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#7fa0d8">
    Software Engineering Student @ CyTech · Paris, France · Open to internships abroad
  </text>
</svg>
